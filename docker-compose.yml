version: '3.8'

services:
  service-dashboard:
    build: .
    container_name: service-dashboard
    ports:
      - "3000:3000"
    # Use Docker socket proxy for secure, limited Docker API access
    # No direct docker.sock mount - connects to proxy over TCP
    # Config is baked into image; override with env vars or mount config.yaml if needed
    environment:
      - NODE_ENV=production
      - DOCKER_SOCKET=tcp://docker-socket-proxy:2375
      - DOCKER_ENABLED=true
      - HOST_ENABLED=true
      - SCAN_INTERVAL=60000
      - PROBE_TIMEOUT=3000
      - PROBE_CONCURRENCY=10
      - LOG_LEVEL=info
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      - docker-socket-proxy

  # Read-only Docker socket proxy - exposes only safe API endpoints
  # Runs as root because HAProxy needs to bind port 2375 and write pidfile
  # But it's a read-only proxy with explicit deny rules - safer than direct socket mount
  # Pinned to SHA256 digest for supply chain security (immutable reference)
  # tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Only allow read-only container listing and inspection
      - CONTAINERS=1
      - CONTAINERS_LIST=1
      - CONTAINERS_INSPECT=1
      - IMAGES=1
      - IMAGES_LIST=1
      - NETWORKS=1
      - NETWORKS_LIST=1
      - VOLUMES=1
      - VOLUMES_LIST=1
      - INFO=1
      - VERSION=1
      # Explicitly deny all mutation operations
      - CONTAINERS_CREATE=0
      - CONTAINERS_DELETE=0
      - CONTAINERS_EXEC=0
      - CONTAINERS_START=0
      - CONTAINERS_STOP=0
      - CONTAINERS_RESTART=0
      - CONTAINERS_KILL=0
      - CONTAINERS_PRUNE=0
      - CONTAINERS_RENAME=0
      - CONTAINERS_RESIZE=0
      - CONTAINERS_TOP=0
      - CONTAINERS_LOGS=0
      - CONTAINERS_CHANGES=0
      - CONTAINERS_EXPORT=0
      - CONTAINERS_STATS=0
      - CONTAINERS_UPDATE=0
      - IMAGES_BUILD=0
      - IMAGES_CREATE=0
      - IMAGES_DELETE=0
      - IMAGES_LOAD=0
      - IMAGES_PULL=0
      - IMAGES_PUSH=0
      - IMAGES_TAG=0
      - NETWORKS_CREATE=0
      - NETWORKS_DELETE=0
      - NETWORKS_CONNECT=0
      - NETWORKS_DISCONNECT=0
      - VOLUMES_CREATE=0
      - VOLUMES_DELETE=0
      - VOLUMES_PRUNE=0
      # Disable events endpoint to avoid timeout warnings
      - EVENTS=0
    restart: unless-stopped
    # Run as root - HAProxy needs to bind to port 2375 and write pidfile
    # This is a read-only proxy with explicit deny rules - much safer than direct socket mount
    # user: "1001:1001"

networks:
  default:
    name: service-dashboard-network